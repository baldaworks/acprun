profiles:
    default:
        description: CLI to discover, inspect, resolve, and run agents from the Agent Client Protocol (ACP) Registry using native binaries, npx, or uvx
        keywords:
            - acp
            - agent-client-protocol
            - ai-agents
            - coding-agents
            - agent-runner
            - agent-registry
            - registry
            - cli
            - npx
            - uvx
        license: MIT
        tool:
            name: acprun
            main: ./cmd/acprun
        version:
            source: git-tag
        targets:
            - os: darwin
              arch: amd64
            - os: darwin
              arch: arm64
            - os: linux
              arch: amd64
            - os: linux
              arch: arm64
            - os: windows
              arch: amd64
            - os: windows
              arch: arm64
        build:
            ldflags: -s -w
            tags: []
            cgo: false
        distributions:
            npm:
                package: '@baldaworks/acprun'
                platform-package: '@baldaworks/acprun'
                registry: https://registry.npmjs.org
                access: public
                publish-auth: trusted
                repository-url: git+https://github.com/baldaworks/acprun.git
                include-readme: true
