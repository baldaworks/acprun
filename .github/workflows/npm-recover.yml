name: npm-recover

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed omnidist tag-release run containing staged artifacts
        required: true
        type: string
      package:
        description: Launcher to recover
        required: true
        type: choice
        default: '@baldaworks/acprun'
        options:
          - acprun
          - '@baldaworks/acprun'

permissions:
  contents: read
  actions: read

jobs:
  recover_npm:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          run_id = os.environ['SOURCE_RUN_ID']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise ValueError('Source run ID must be numeric')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}']))
          run = api(f'actions/runs/{run_id}')
          assert run['repository']['full_name'] == repository
          assert run['event'] == 'push' and run['status'] == 'completed'
          assert run['path'].split('@')[0] == '.github/workflows/omnidist-release.yml'
          tag = run['head_branch']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)
          assert api(f'commits/{tag}')['sha'] == run['head_sha']
          jobs = api(f'actions/runs/{run_id}/jobs')['jobs']
          assert any(job['name'] == 'prepare' and job['conclusion'] == 'success' for job in jobs)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={tag[1:]}\n')
          print(f'Recovering a launcher from verified {tag} build {run_id}')
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download original staged artifacts
        uses: actions/download-artifact@v4
        with:
          name: omnidist-staged
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore original staged artifacts
        run: tar -xzf omnidist-staged.tgz
      - name: Verify selected launcher and published dependencies
        id: launcher
        env:
          PUBLISH_PACKAGE: ${{ inputs.package }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          name = os.environ['PUBLISH_PACKAGE']
          assert name in ['acprun', '@baldaworks/acprun']
          version = os.environ['EXPECTED_VERSION']
          assert Path('.omnidist/default/dist/VERSION').read_text().strip() == version
          matches = [(path, json.loads(path.read_text())) for path in Path('.omnidist/default/npm').rglob('package.json')]
          matches = [(path, metadata) for path, metadata in matches if metadata.get('name') == name]
          assert len(matches) == 1
          path, metadata = matches[0]
          assert metadata['version'] == version and metadata['license'] == 'MIT'
          assert metadata['bin'] == {'acprun': 'acprun.js'} and not metadata.get('scripts')
          assert metadata['description'] and 'registry' in metadata['keywords']
          assert metadata['repository']['url'] == 'git+https://github.com/baldaworks/acprun.git'
          platforms = {'@baldaworks/acprun-' + suffix for suffix in ['darwin-x64', 'darwin-arm64', 'linux-x64', 'linux-arm64', 'win32-x64', 'win32-arm64']}
          assert metadata['optionalDependencies'] == {platform: version for platform in platforms}
          def published(package):
              url = 'https://registry.npmjs.org/' + urllib.parse.quote(package, safe='') + '/' + urllib.parse.quote(version, safe='')
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.load(response)
          for platform in sorted(platforms):
              assert published(platform)['version'] == version
          try:
              existing = published(name)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              existing = None
          if existing is not None:
              for key in ['name', 'version', 'description', 'keywords', 'license', 'repository', 'bin', 'optionalDependencies']:
                  assert existing.get(key) == metadata.get(key), f'Existing {key} differs'
              print(f'{name}@{version} is already published with matching metadata; skipping')
          else:
              directory = str(path.parent)
              assert '\n' not in directory and '\r' not in directory
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write(f'publish=true\nlauncher_dir={directory}\n')
              print(f'Verified {name}@{version} and all six published dependencies')
          PY
      - name: Publish missing launcher
        if: steps.launcher.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          LAUNCHER_DIR: ${{ steps.launcher.outputs.launcher_dir }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::Missing repository secret: NPM_PUBLISH_TOKEN'
            exit 1
          fi
          npm publish --ignore-scripts --access public --tag latest "$LAUNCHER_DIR"
